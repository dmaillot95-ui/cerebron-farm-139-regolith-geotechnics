name: F139 NVIDIA Newton Canary V1
on:
  workflow_dispatch:
  push:
    paths: ['runtime/nvidia_newton_canary_v1.py','.github/workflows/nvidia-newton-canary-v1.yml']
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check newton
      - run: python runtime/nvidia_newton_canary_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f139-nvidia-newton-canary-v1
          path: artifacts/f139_newton_canary_v1.json
