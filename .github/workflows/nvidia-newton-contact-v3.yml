name: F139 NVIDIA Newton Contact V3
on:
  workflow_dispatch:
  push:
    paths: ['runtime/nvidia_newton_contact_v3.py','.github/workflows/nvidia-newton-contact-v3.yml']
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check newton
      - run: python runtime/nvidia_newton_contact_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f139-nvidia-newton-contact-v3
          path: artifacts/f139_newton_contact_v3.json
