name: F139 Newton API Probe
on:
  workflow_dispatch:
  push:
    paths: ['runtime/newton_api_probe.py','.github/workflows/newton-api-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check newton
      - run: python runtime/newton_api_probe.py
